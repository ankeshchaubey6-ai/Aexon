name: Build WebContainer Snapshot

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

jobs:
  build-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build snapshot
        run: npm run build:snapshot

      - name: Validate snapshot
        run: npm run validate:snapshot

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet public/snapshot/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Snapshot chunks have changed, will commit"
          fi

      - name: Configure git
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Commit and push snapshot
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git add public/snapshot/
          git commit -m "chore: rebuild WebContainer snapshot chunks [skip ci]"
          git push
